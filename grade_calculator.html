<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>Student Grade Calculator</h1>

    <div class="row">
        <div class="field">
            <label>First Name</label>
            <input type="text" id="fname"
        /div>
        <div class="field">
            <label>Last Name</label>
            <input type="text" id="lname" 
        /div>
    </div>

    <h3>Enter your grades</h3>

    <div class="row">
        <div class="field">
            <label>Science</label>
            <input type="number" id="science">
        </div>
        <div class="field">
            <label>Math</label>
            <input type="number" id="math">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>English</label>
            <input type="number" id="english">
        </div>
        <div class="field">
            <label>Filipino</label>
            <input type="number" id="filipino">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>ICT</label>
            <input type="number" id="ict">
        </div>
        <div class="field">
            <label>PE</label>
            <input type="number" id="pe">
        </div>
    </div>

    <button onclick="calculateGWA()">Calculate GWA</button>

    <div class="result" id="result"></div>
    <div class="gwa" id="gwa"></div>
</div>

<script src="script.js"></script>
</body>
</html>
